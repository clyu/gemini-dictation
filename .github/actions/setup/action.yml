name: Set up the build
description: Installs what the jobs that run cargo have in common. The repository must be checked out first.

inputs:
  components:
    description: The toolchain components to install besides the default ones, separated by commas.
    default: ""

runs:
  using: composite
  steps:
    - name: Install system libraries
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@v2
